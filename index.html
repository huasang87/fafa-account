<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9a0f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>✨ Fafa的账本 ✨</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=3.0.2">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 id="pageTitle"><span aria-hidden="true">✦</span> Fafa的账本 <span aria-hidden="true">✦</span></h1>
      <button id="syncStatus" class="sync-status" data-state="connecting" aria-label="查看同步状态或重试同步"><i></i><span>正在连接…</span></button>
    </header>
    <p id="previewBanner" class="preview-banner" hidden>预览模式 · 示例数据，不连接真实账本</p>
    <p id="storageError" class="error-banner" role="alert" hidden></p>
    <section id="bank" class="bank glass" aria-label="我的小金库">
      <button id="addRecord" class="circle-button add-record" aria-label="手动记一笔">+</button>
      <img class="bank-rabbit" src="assets/rabbit-bank.png" alt="可爱的小兔存钱罐" width="180" height="180">
      <div class="bank-numbers"><p>Fafa的小金库</p><div class="balance"><strong id="balance">0</strong><span>元</span></div></div>
    </section>
    <section id="earnSection" class="tab-panel" aria-label="赚钱">
      <button id="wishStrip" class="wish-strip" hidden><span class="wish-thumb" id="wishThumb"></span><strong id="wishStripName"></strong><span id="wishStripStatus"></span><span class="chevron" aria-hidden="true">›</span></button>
      <div class="section-heading"><h2>赚钱任务</h2><button id="resetTasks" class="circle-button" aria-label="刷新任务次数">↻</button></div>
      <div id="taskList" class="task-list"></div>
      <p class="quiet-note">所有任务每周一更新，本周次数慢慢完成</p>
    </section>
    <section id="spendSection" class="tab-panel" aria-label="买东西" hidden>
      <div class="section-heading"><h2>买东西</h2></div>
      <form id="expenseForm" class="glass form-card">
        <label for="expenseName">买了什么</label><input id="expenseName" name="name" maxlength="60" placeholder="比如：彩色铅笔" required autocomplete="off">
        <label for="expenseAmount">花了多少钱</label><div class="money-input"><span>¥</span><input id="expenseAmount" name="amount" inputmode="decimal" placeholder="请输入金额" required autocomplete="off"></div>
        <p id="expensePreview" class="form-note">记下每一笔小小的花费</p>
        <button class="button primary" type="submit">确认花钱</button>
      </form>
    </section>
    <section id="historySection" class="tab-panel" aria-label="记录" hidden>
      <div class="section-heading"><h2>记录</h2><div class="heading-actions"><button id="exportData" class="small-button">导出备份</button><button id="clearData" class="small-button" aria-label="清空账本">♧ 清空</button></div></div>
      <div id="historyList" class="glass history-list"></div><p id="historyNote" class="quiet-note"></p>
    </section>
    <section id="wishSection" class="tab-panel" aria-label="想买的" hidden>
      <p class="wish-subtitle">给努力存钱的自己，一个小期待</p>
      <div id="wishEmpty" class="glass empty-wish"><img src="assets/rabbit-bank.png" alt="小兔陪你一起存钱" width="180" height="180"><h2>你最想买什么？</h2><p>放一张照片，写下价格<br>一起慢慢攒起来</p><button id="addWish" class="button primary">添加愿望</button></div>
      <article id="wishDetail" class="glass wish-detail" hidden>
        <div class="wish-photo-wrap"><img id="wishPhoto" alt="想买的东西"><button id="changeWishPhoto" class="photo-edit">▧ 更换照片</button></div>
        <h2 id="wishName"></h2><p class="target-price">目标价格 <strong id="wishPrice"></strong></p>
        <div class="wish-progress"><div class="progress-caption"><span>已经攒了</span><strong id="wishSaved"></strong></div><div id="wishProgressBar" class="progress-track" role="progressbar" aria-label="愿望储蓄进度" aria-valuemin="0" aria-valuemax="100"><i></i></div><p id="wishRemaining"></p></div>
        <button id="editWish" class="button secondary">修改愿望</button><button id="removeWish" class="text-button">移除愿望</button>
      </article>
    </section>
    <footer class="version">v3.0.2 · 一点点，攒出小愿望</footer>
  </main>
  <nav class="bottom-nav" aria-label="主要导航">
    <button data-tab="earn" aria-current="page"><span class="nav-icon" aria-hidden="true">🪙</span><span>赚钱</span></button>
    <button data-tab="spend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8zM8 9V6a4 4 0 0 1 8 0v3"/></svg><span>买东西</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v16M12 5C9 2 5 2 2 4v16c4-2 7-2 10 1 3-3 6-3 10-1V4c-3-2-7-2-10 1z"/></svg><span>记录</span></button>
    <button data-tab="wish"><span id="wishBadge" class="ready-badge" hidden>已攒够</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 3 12C-3 5 6-2 12 5 18-2 27 5 21 12z"/></svg><span>想买的</span></button>
  </nav>
  <dialog id="dialog" aria-labelledby="dialogTitle"><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请开启浏览器 JavaScript 后使用账本。已有数据不会被清除。</noscript>
  <script type="module" src="app.js?v=3.0.2"></script>
</body>
</html>
